<meta name="theme-color" content="#14402f">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f4f6fb;--card:#fff;--tx:#161b2e;--mu:#6b7390;--bd:#e3e7f1;--ac:#4f46e5;--gr:#16a34a;--rd:#dc2626;--oa:#fff}
:root[data-theme=dark]{--bg:#0e1220;--card:#181e33;--tx:#e8ebf7;--mu:#98a0bd;--bd:#2a3150;--ac:#818cf8;--gr:#4ade80;--rd:#f87171}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:flex;min-height:100vh}
nav{width:210px;padding:20px 12px;background:var(--card);border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;flex-shrink:0}
nav h1{font-size:18px;margin:0 8px 18px}
nav a{display:block;padding:10px 12px;border-radius:10px;color:var(--mu);cursor:pointer;margin-bottom:2px}
nav a.on{background:var(--ac);color:var(--oa)}
main{flex:1;padding:22px;max-width:1000px;min-width:0}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.top h2{margin:0;flex:1;font-size:22px}
.mo{display:flex;align-items:center;gap:6px}.mo b{min-width:120px;text-align:center}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 11px}
button{cursor:pointer}button.p{background:var(--ac);color:var(--oa);border-color:var(--ac);font-weight:600}
button.d{color:var(--rd)}button.s{padding:4px 8px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.grid .card{margin:0}.card h3{margin:0 0 10px;font-size:15px}
.k{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.v{font-size:23px;font-weight:700;margin-top:2px}
.g{color:var(--gr)}.r{color:var(--rd)}.m{color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
table{width:100%;border-collapse:collapse}th,td{padding:9px 6px;text-align:left;border-bottom:1px solid var(--bd)}
th{color:var(--mu);font-size:12px;cursor:pointer}td.n,th.n{text-align:right}
.bar{height:9px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.bar i.o{background:var(--rd)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters input,.filters select{flex:1;min-width:110px}
.pie{width:130px;height:130px;border-radius:50%;flex-shrink:0}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);width:min(440px,94vw);padding:20px}
dialog::backdrop{background:#0008}
label{display:block;margin:10px 0 3px;color:var(--mu);font-size:13px}dialog input,dialog select,dialog textarea{width:100%}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:12px;font-weight:600}
.seg button.on.i{background:var(--gr);color:var(--oa);border-color:var(--gr)}.seg button.on.e{background:var(--rd);color:var(--oa);border-color:var(--rd)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;display:none;z-index:9;gap:12px;align-items:center}
#toast button{background:none;border:0;color:var(--bg);text-decoration:underline;padding:0 0 0 10px;font-weight:700}
#fab{position:fixed;right:20px;bottom:20px;z-index:5;padding:14px 20px;border-radius:30px;box-shadow:0 6px 20px #0004}
.empty{color:var(--mu);text-align:center;padding:24px}
@media(max-width:760px){
#app{display:block}
nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--bd);z-index:6;overflow-x:auto}
nav h1{display:none}nav a{flex:1;text-align:center;font-size:11px;padding:8px 10px;white-space:nowrap;margin:0}
main{padding:14px 14px 150px}.two{grid-template-columns:1fr}.top h2{flex-basis:100%}
#fab{bottom:calc(64px + env(safe-area-inset-bottom,0px));right:14px}
.hm{display:none}}
</style></head><body>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<button id="fab" class="p">+ Add Transaction</button>
<div id="toast"></div><dialog id="dlg"></dialog>
<script>
const LOGO=document.querySelector('link[rel=icon]').href,KEY='budget.v1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COL=['#4f46e5','#0ea5e9','#16a34a','#f59e0b','#ef4444','#a855f7','#14b8a6','#ec4899','#84cc16','#64748b'];
const NAMES=[['dash','Dashboard'],['tx','Transactions'],['bud','Budgets'],['cat','Categories'],['rep','Reports'],['sav','Accounts'],['set','Settings']];
function seed(){
 const c=(n,t,i)=>({id:'c'+i,name:n,type:t,color:COL[i%COL.length]});
 const cats=[];
 return{v:1,settings:{currency:'USD',theme:matchMedia('(prefers-color-scheme:dark)').matches?'forest':'light',opening:0},cats,budgets:{},goals:[],tx:[]}}
function valid(d){return d&&typeof d==='object'&&Array.isArray(d.tx)&&Array.isArray(d.cats)&&d.settings&&d.tx.every(x=>x&&/^\d{4}-\d\d-\d\d$/.test(x.date)&&Number.isInteger(x.amt)&&['income','expense','transfer'].includes(x.type))&&d.cats.every(x=>x&&x.id&&x.name&&['income','expense'].includes(x.type))}
let S;try{const raw=localStorage.getItem(KEY);S=raw?JSON.parse(raw):null;if(S&&!valid(S)){localStorage.setItem(KEY+'.corrupt',raw);S=null}}catch(e){S=null}
function mig(){S.budgets=S.budgets||{};S.goals=S.goals||[];
 let a=(Array.isArray(S.accounts)?S.accounts:[]).filter(a=>a&&a.id&&a.name).map(a=>({id:String(a.id),name:String(a.name),type:['checking','savings','other'].includes(a.type)?a.type:(/sav/i.test(a.name)?'savings':'checking'),opening:Number.isInteger(a.opening)?a.opening:0}));
 if(!a.length)a=[{id:'a1',name:'Checking',type:'checking',opening:(S.settings&&Number.isInteger(S.settings.opening))?S.settings.opening:0},{id:'a2',name:'Savings',type:'savings',opening:0}];
 S.accounts=a;S.tx.forEach(x=>{if(x.type==='transfer'){if(!a.some(z=>z.id===x.from))x.from=a[0].id;if(!a.some(z=>z.id===x.to))x.to=a[a.length-1].id}else if(!a.some(z=>z.id===x.acct))x.acct=a[0].id})}
if(!S)S=seed();mig();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save (storage full or blocked)')}}
const fmt=c=>new Intl.NumberFormat('en-US',{style:'currency',currency:S.settings.currency||'USD'}).format(c/100);
const toC=s=>{const n=parseFloat(String(s).replace(/[^0-9.\-]/g,''));return isNaN(n)?NaN:Math.round(Math.abs(n)*100)};
const cat=id=>S.cats.find(c=>c.id===id)||{name:'Uncategorized',color:'#888',type:'expense'};
const mk=d=>d.slice(0,7);let cur=new Date().toISOString().slice(0,7),view='dash',F={q:'',cat:'',type:'',acct:'',from:'',to:'',min:'',max:'',all:false,sort:'date',dir:-1},RANGE='m0';
const shift=(m,n)=>{const[y,mm]=m.split('-').map(Number),d=new Date(y,mm-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const mlabel=m=>{const[y,mm]=m.split('-').map(Number);return new Date(y,mm-1,1).toLocaleString('en-US',{month:'long',year:'numeric'})};
const fd=d=>{const[y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})};
const sum=(l,t)=>l.filter(x=>x.type===t).reduce((a,x)=>a+x.amt,0);
const inM=m=>S.tx.filter(x=>mk(x.date)===m);
function toast(msg,undo){const t=$('#toast');t.innerHTML=esc(msg)+(undo?'<button id=ud>Undo</button>':'');t.style.display='flex';if(undo)$('#ud').onclick=()=>{undo();t.style.display='none'};clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',5000)}
function modal(html){const d=$('#dlg');d.innerHTML=html;d.showModal();return d}
function confirmBox(msg,ok,label='Delete'){const d=modal(`<p>${msg}</p><div class=row><button id=no>Cancel</button><button id=yes class="p d">${label}</button></div>`);d.querySelector('#no').onclick=()=>d.close();d.querySelector('#yes').onclick=()=>{d.close();ok()}}
function nav(){$('#nav').innerHTML='<h1><img src="'+logo()+'" alt="" style="width:34px;height:34px;border-radius:9px;vertical-align:middle;margin-right:8px">Just Budget</h1>'+NAMES.map(([k,n])=>`<a class="${view===k?'on':''}" data-v="${k}">${n}</a>`).join('');document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{view=a.dataset.v;render()})}
const monthBar=()=>`<div class="mo"><button id=pm>‹</button><b>${mlabel(cur)}</b><button id=nm>›</button><button id=tm class=s>Today</button></div>`;
function bindMonth(){$('#pm').onclick=()=>{cur=shift(cur,-1);render()};$('#nm').onclick=()=>{cur=shift(cur,1);render()};$('#tm').onclick=()=>{cur=new Date().toISOString().slice(0,7);render()}}
function byCat(list,t){const m={};list.filter(x=>x.type===t).forEach(x=>m[x.cat]=(m[x.cat]||0)+x.amt);return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function catRows(rows,total){return rows.length?rows.map(([id,v])=>`<div class=row style="margin:5px 0"><span><span class=dot style="background:${cat(id).color}"></span>${esc(cat(id).name)}</span><span>${fmt(v)} <span class=m>${total?Math.round(v/total*100):0}%</span></span></div>`).join(''):'<div class=empty>No data</div>'}
function pie(rows,total){if(!total)return'<div class=pie style="background:var(--bd)"></div>';let a=0;return`<div class=pie style="background:conic-gradient(${rows.map(([id,v])=>{const s=a;a+=v/total*100;return cat(id).color+' '+s+'% '+a+'%'}).join(',')})"></div>`}
function bars(items){const mx=Math.max(1,...items.flatMap(i=>i.v));return items.map(i=>`<div style="margin:8px 0"><div class=row><span>${esc(i.l)}</span><span class=m>${i.v.map(fmt).join(' / ')}</span></div>${i.v.map((x,j)=>`<div class=bar style="height:7px;margin:2px 0"><i class="${j?'o':''}" style="width:${x/mx*100}%;${j?'':'background:var(--gr)'}"></i></div>`).join('')}</div>`).join('')}

const logo=()=>LOGOS[THEMES[S.settings.theme]?S.settings.theme:'light'];
function applyBg(){document.querySelector('link[rel=icon]').href=logo();const t=THEMES[S.settings.theme]||THEMES.light,r=document.documentElement;for(const k of['bg','card','tx','mu','bd','ac','gr','rd','oa'])r.style.setProperty('--'+k,t[k]);r.dataset.theme=t.d?'dark':'light';r.style.colorScheme=t.d?'dark':'light'}
const TY={checking:'Checking',savings:'Savings',other:'Other'};
const sg=x=>x.type=='income'?'+':x.type=='expense'?'−':'⇄ ';
const accBal=(id,before)=>{const a=S.accounts.find(z=>z.id===id);let b=a?a.opening:0;S.tx.forEach(x=>{if(before&&x.date.slice(0,7)>=before)return;if(x.type==='transfer'){if(x.from===id)b-=x.amt;if(x.to===id)b+=x.amt}else if(x.acct===id)b+=x.type==='income'?x.amt:-x.amt});return b};
function dash(){const l=inM(cur),inc=sum(l,'income'),ex=sum(l,'expense'),rem=inc-ex,rate=inc>0?rem/inc*100:0;
 const bud=Object.values(S.budgets).reduce((a,b)=>a+b,0),bspent=Object.keys(S.budgets).reduce((a,id)=>a+l.filter(x=>x.type==='expense'&&x.cat===id).reduce((s,x)=>s+x.amt,0),0);
 const ec=byCat(l,'expense'),months=[-2,-1,0].map(n=>shift(cur,n));
 const recent=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
 const up=S.tx.filter(x=>x.rec).map(x=>({x,next:nextDate(x)})).sort((a,b)=>a.next.localeCompare(b.next)).slice(0,4);
 return`<div class=top><h2>Dashboard</h2>${monthBar()}</div>${S.cats.length?'':'<div class=card><h3>Welcome 👋</h3><p class=m>Everything starts empty. Create your own income and expense categories first, then add transactions and set budgets. You start with two accounts, Checking and Savings (manage them on the Accounts page). All data stays in this browser.</p><button class=p data-go=cat>Create categories</button></div>'}
 <div class=grid>${[['Income',fmt(inc),'g'],['Expenses',fmt(ex),'r'],['Remaining',fmt(rem),rem<0?'r':'g'],['Savings rate',inc>0?rate.toFixed(0)+'%':'—',rem<0?'r':'']].map(a=>`<div class=card><div class=k>${a[0]}</div><div class="v ${a[2]}" style="font-size:${a[1].length>12?17:23}px">${a[1]}</div></div>`).join('')}</div>
 <div class=grid>${S.accounts.map(a=>{const b=accBal(a.id,shift(cur,1));return`<div class=card><div class=k>${esc(a.name)} balance</div><div class="v ${b<0?'r':''}">${fmt(b)}</div></div>`}).join('')}<div class=card><div class=k>Total</div><div class=v>${fmt(S.accounts.reduce((t,a)=>t+accBal(a.id,shift(cur,1)),0))}</div></div></div>
 <div class=two><div class=card><h3>Where money went</h3><div class=row style="align-items:flex-start;gap:16px">${pie(ec,ex)}<div style="flex:1">${catRows(ec.slice(0,6),ex)}</div></div></div>
 <div class=card><h3>Income vs expenses</h3>${bars(months.map(m=>({l:mlabel(m),v:[sum(inM(m),'income'),sum(inM(m),'expense')]})))}<div class="m" style="font-size:12px">Green = income, red = expenses</div></div></div>
 <div class=card><h3>Budget vs actual${bud?` <span class=m style="font-weight:400">· ${fmt(bud)} budgeted, ${fmt(bud-bspent)} left</span>`:''}</h3>${budRows(l)||'<div class=empty>No budgets yet — set them on the Budgets page.</div>'}</div>
 <div class=two><div class=card><h3>Recent</h3>${recent.length?recent.map(x=>`<div class=row style="margin:6px 0"><span>${esc(x.desc)} <span class=m>${fd(x.date)}</span></span><span class="${x.type=='income'?'g':''}">${sg(x)}${fmt(x.amt)}</span></div>`).join(''):'<div class=empty>Nothing yet</div>'}</div>
 <div class=card><h3>Upcoming recurring</h3>${up.length?up.map(u=>`<div class=row style="margin:6px 0"><span>${esc(u.x.desc)} <span class=m>${fd(u.next)}</span></span><button class=s data-rec="${u.x.id}">Add now</button></div>`).join(''):'<div class=empty>Mark a transaction recurring to see it here. Nothing is added automatically.</div>'}</div></div>`}
function budRows(l){return Object.entries(S.budgets).filter(([id])=>S.cats.some(c=>c.id===id)).map(([id,b])=>{const sp=l.filter(x=>x.type==='expense'&&x.cat===id).reduce((a,x)=>a+x.amt,0),p=b?sp/b*100:0;return`<div style="margin:12px 0"><div class=row><b><span class=dot style="background:${cat(id).color}"></span>${esc(cat(id).name)}</b><span class="${sp>b?'r':''}">${sp>b?'Over budget by '+fmt(sp-b):Math.round(p)+'% used'}</span></div><div class=bar><i class="${sp>b?'o':''}" style="width:${Math.min(100,p)}%"></i></div><div class="row m"><span>Budget ${fmt(b)}</span><span>Spent ${fmt(sp)}</span><span>Left ${fmt(b-sp)}</span></div></div>`}).join('')}
function nextDate(x){const[y,m,d]=x.date.split('-').map(Number);let dt=new Date(y,m-1,d),today=new Date(),i=0;const step=()=>{x.rec=='weekly'?dt.setDate(dt.getDate()+7):x.rec=='biweekly'?dt.setDate(dt.getDate()+14):x.rec=='yearly'?dt.setFullYear(dt.getFullYear()+1):dt.setMonth(dt.getMonth()+1)};do{step()}while(dt<new Date(today.getFullYear(),today.getMonth(),today.getDate())&&++i<1000);

function csv(bom){const q=v=>'"'+String(v).replace(/"/g,'""').replace(/^([=+\-@])/,"'$1")+'"';const rows=[['Date','Description','Type','Category','Account','Amount','Notes','Recurring'].map(q).join(',')].concat([...S.tx].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,x.desc,x.type,x.type=='transfer'?'':cat(x.cat).name,x.type=='transfer'?acct(x.from).name+' → '+acct(x.to).name:acct(x.acct).name,(x.amt/100).toFixed(2),x.notes,x.rec].map(q).join(',')));return(bom?'\ufeff':'')+rows.join('\r\n')}
function doImport(text){let d;try{d=JSON.parse(text)}catch(e){return toast('Not a valid JSON file')}
 if(!valid(d))return toast('Backup is malformed — nothing was changed');
 confirmBox('Importing will <b>replace all existing data</b> in this app. Export a backup first if unsure.',()=>{S=d;mig();save();document.documentElement.dataset.theme=S.settings.theme||'light';applyBg();toast('Backup imported');render()},'Replace data')}
function render(){nav();const m=$('#main');m.innerHTML={dash,tx:txv,bud:budv,cat:catv,rep:repv,sav:savv,set:setv}[view]();if($('#pm'))bindMonth();bind();scrollTo(0,0)}
function bind(){const q=s=>document.querySelectorAll(s),on=(s,f)=>q(s).forEach(f);on('[data-go]',b=>b.onclick=()=>{view=b.dataset.go;render()});
 on('[data-rec]',b=>b.onclick=()=>{const x=S.tx.find(t=>t.id===b.dataset.rec),d=nextDate(x);S.tx.push({...x,id:uid(),date:d});save();toast('Added '+x.desc+' for '+fd(d));render()});
 const rf=()=>{const p=$('#fq').selectionStart;render();const e=$('#fq');if(e){e.focus();e.setSelectionRange(p,p)}};
 if($('#fq')){$('#fq').oninput=e=>{F.q=e.target.value;rf()};$('#fc').onchange=e=>{F.cat=e.target.value;render()};$('#ft').onchange=e=>{F.type=e.target.value;render()};$('#fac').onchange=e=>{F.acct=e.target.value;render()};
  if($('#ff')){$('#ff').onchange=e=>{F.from=e.target.value;render()};$('#ftt').onchange=e=>{F.to=e.target.value;render()};$('#fmn').onchange=e=>{F.min=e.target.value;render()};$('#fmx').onchange=e=>{F.max=e.target.value;render()};$('#fa').onchange=e=>{F.all=e.target.checked;render()};}
  $('#fmore').onclick=()=>{const open=F.more||F.from||F.to||F.min||F.max||F.all;if(open){F.from=F.to=F.min=F.max='';F.all=false;F.more=false}else F.more=true;render()};if($('#fx'))$('#fx').onclick=()=>{F={q:'',cat:'',type:'',acct:'',from:'',to:'',min:'',max:'',all:false,sort:'date',dir:-1};render()};
  on('[data-s]',h=>h.onclick=()=>{const k=h.dataset.s;F.dir=F.sort==k?-F.dir:(k=='date'||k=='amt'?-1:1);F.sort=k;render()});
  on('[data-e]',b=>b.onclick=()=>{const x=S.tx.find(t=>t.id===b.dataset.e);x.type=='transfer'?trForm(x):txForm(x)});
  on('[data-dup]',b=>b.onclick=()=>{const x=S.tx.find(t=>t.id===b.dataset.dup);{const n={...x,id:undefined,date:new Date().toISOString().slice(0,10)};x.type=='transfer'?trForm(n):txForm(n)}});
  on('[data-del]',b=>b.onclick=()=>confirmBox('Delete this transaction?',()=>{const i=S.tx.findIndex(t=>t.id===b.dataset.del),x=S.tx.splice(i,1)[0];save();render();toast('Transaction deleted',()=>{S.tx.push(x);save();render()})}))}
 on('[data-b]',i=>i.onchange=()=>{const v=toC(i.value);if(i.value.trim()===''||v===0)delete S.budgets[i.dataset.b];else if(isNaN(v)){toast('Enter a valid amount');return}else S.budgets[i.dataset.b]=v;save();render()});
 on('[data-nc]',b=>b.onclick=()=>catForm(null,b.dataset.nc));on('[data-ec]',b=>b.onclick=()=>catForm(S.cats.find(c=>c.id===b.dataset.ec)));on('[data-dc]',b=>b.onclick=()=>delCat(b.dataset.dc));
 if($('#rg')){$('#rg').onchange=e=>{RANGE=e.target.value;render()};if($('#ca')){$('#ca').onchange=e=>{window.CR={...window.CR,a:e.target.value};render()};$('#cb').onchange=e=>{window.CR={...window.CR,b:e.target.value};render()}}}
 if($('#btr'))$('#btr').onclick=()=>trForm();if($('#nac'))$('#nac').onclick=()=>acctForm();on('[data-dep]',b=>b.onclick=()=>txForm({date:new Date().toISOString().slice(0,10),desc:'',amt:0,type:'income',cat:'',notes:'',rec:'',acct:b.dataset.dep}));on('[data-ea]',b=>b.onclick=()=>acctForm(S.accounts.find(a=>a.id===b.dataset.ea)));if($('#ng'))$('#ng').onclick=()=>goalForm();on('[data-ge]',b=>b.onclick=()=>goalForm(S.goals.find(g=>g.id===b.dataset.ge)));on('[data-gd]',b=>b.onclick=()=>confirmBox('Delete this goal?',()=>{S.goals=S.goals.filter(g=>g.id!==b.dataset.gd);save();render()}));
 if($('#cu')){
  on('[data-bg]',b=>b.onclick=()=>{S.settings.theme=b.dataset.bg;applyBg();save();render()});$('#cu').onchange=e=>{S.settings.currency=e.target.value;save();toast('Currency updated')};
  $('#eb').onclick=()=>dl('budget-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S,null,2),'application/json');$('#ec').onclick=()=>dl('transactions.csv',csv(false),'text/csv');$('#ex').onclick=()=>dl('transactions-excel.csv',csv(true),'text/csv;charset=utf-8');
  $('#ib').onclick=()=>$('#fi').click();$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>20e6)return toast('File too large');const r=new FileReader();r.onload=()=>doImport(r.result);r.readAsText(f)};
  $('#ca').onclick=()=>confirmBox('This permanently erases <b>all</b> transactions, categories, budgets and goals. Export a backup first!',()=>{confirmBox('Really erase everything?',()=>{S={v:1,settings:{...S.settings,opening:0},cats:[],tx:[],budgets:{},goals:[]};mig();save();render()},'Erase all')},'Continue')}}
$('#fab').onclick=()=>txForm();
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')||$('#dlg').open)return;if(e.key==='n'){e.preventDefault();txForm()}if(e.key==='ArrowLeft'&&$('#pm')){cur=shift(cur,-1);render()}if(e.key==='ArrowRight'&&$('#nm')){cur=shift(cur,1);render()}});
document.documentElement.dataset.theme=S.settings.theme||'light';applyBg();save();render();
</script></body></html>
